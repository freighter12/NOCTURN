[package]
name = "nocturn-music"
version = "0.1.0"
description = "Nocturn Music for iPhone"
edition = "2021"
publish = false

[lib]
name = "nocturn_music_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-nocturn = { path = "../plugins/nocturn" }
# native-tls uses Apple's own TLS on iPhone (no C crypto library to cross-compile).
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "charset", "http2", "json"] }

tokio = { version = "1", features = ["rt", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
