[package]
name = "nocturn"
version = "0.3.0"
description = "NOCTURN — Windows optimisation engine and AI desktop assistant"
edition = "2021"
publish = false

[lib]
name = "nocturn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
codegen-units = 1
lto = true
# Speed, not size: with LTO the whole program is re-optimised at link time
# with this level, which overrides per-package levels. "s" cost the benchmark
# kernels up to 60% (measured 2026-11-06), so benchmark results were wrong.
opt-level = 3
panic = "abort"
strip = true

# Benchmark kernels are always optimised, even in dev builds, so the numbers
# NOCTURN shows match a release build.
[profile.dev.package.nocturn-bench]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
futures-util = "0.3.34"
nvml-wrapper = "0.13"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "charset", "http2", "system-proxy", "json", "stream"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.40.1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
sha2 = "0.10"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Performance", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Security", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_Power", "Win32_NetworkManagement_WiFi", "Win32_Security_Credentials", "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_System_Com", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_Services", "Win32_Graphics_Gdi", "Win32_UI_ColorSystem"] }
winreg = "0.56.0"
webview2-com = "0.39"
nocturn-bench = { path = "bench" }
wmi = "0.18.4"
lofty = "0.25.5"
png = "0.18"
base64 = "0.21"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "wav", "pcm", "vorbis", "ogg", "alac", "adpcm"] }
ebur128 = "0.1"

[dev-dependencies]
tempfile = "3.27.0"
